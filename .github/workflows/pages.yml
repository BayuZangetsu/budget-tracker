# Publish the tracker to GitHub Pages.
#
# The app has no build step: these three files are the whole site, so this
# job only uploads them. A gh-pages branch would need the same files
# committed twice; deploying from main means one `git push` updates the
# live site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be re-deployed from the Actions tab without a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Nothing to compile, so the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
